<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffcf4d">
  <title>텔레스트레이션 · 선생님</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="teacher">
  <header class="topbar">
    <div class="logo">✏️ 텔레스트레이션 <span class="muted">· 선생님</span></div>
    <button id="t-logout" class="btn small" hidden>로그아웃</button>
  </header>

  <main>
    <!-- 로그인 -->
    <section id="t-login" class="screen card narrow">
      <h1>수업 열기</h1>
      <p class="muted">처음 쓰는 수업 코드면 새 수업이 만들어지고, 쓰던 코드면 로그인돼요. 같은 코드와 비밀번호로 매 수업 다시 들어오면 됩니다.</p>
      <label class="field">
        <span>수업 코드 <small class="muted">(한글·영문·숫자 2~10자, 예: 3반)</small></span>
        <input id="t-code" maxlength="10" autocomplete="off" placeholder="3반">
      </label>
      <label class="field">
        <span>선생님 비밀번호 <small class="muted">(4자 이상)</small></span>
        <input id="t-pass" type="password" autocomplete="current-password">
      </label>
      <button id="t-login-btn" class="btn primary big">들어가기</button>
      <p id="t-login-error" class="error" role="alert"></p>
      <a class="teacher-link" href="./">← 학생 화면으로</a>
    </section>

    <!-- 대시보드 -->
    <section id="t-dash" class="screen" hidden>
      <div class="t-top">
        <div class="card t-join">
          <span class="muted">학생 접속 안내</span>
          <div class="t-code-big" id="t-code-big"></div>
          <ol class="t-steps">
            <li>주소 <strong id="t-url"></strong> 접속</li>
            <li>이름 쓰고, 수업 코드 <strong id="t-code-inline"></strong> 입력</li>
            <li>자기 모둠 번호 누르기</li>
          </ol>
          <button id="t-copy" class="btn small">🔗 학생용 링크 복사</button>
        </div>

        <div class="card t-settings">
          <h2>수업 설정</h2>
          <div class="settings three">
            <label>모둠 수 <select id="t-groups"></select></label>
            <label>그리기 시간
              <select id="t-draw">
                <option value="30">30초</option><option value="45">45초</option><option value="60">60초</option>
                <option value="90">90초</option><option value="120">120초</option><option value="180">180초</option>
              </select>
            </label>
            <label>추측 시간
              <select id="t-guess">
                <option value="15">15초</option><option value="20">20초</option><option value="30">30초</option>
                <option value="45">45초</option><option value="60">60초</option><option value="90">90초</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>제시어 목록 <small id="t-words-count" class="muted"></small></span>
            <textarea id="t-words" rows="5" placeholder="한 줄에 하나씩 (쉼표로 구분해도 돼요). 비워 두면 기본 제시어 200여 개를 씁니다.&#10;예) 광합성&#10;화산&#10;자석"></textarea>
          </label>
          <p class="muted small">각 학생은 첫 순서에 이 목록에서 무작위로 나온 3개 중 하나를 골라 시작해요. 한 단어는 20자까지.</p>
          <div class="row between">
            <span id="t-save-status" class="muted small">바꾸면 자동으로 저장돼요</span>
            <button id="t-save" class="btn small">지금 저장</button>
          </div>
        </div>
      </div>

      <div class="card t-controls">
        <button id="t-open" class="btn primary">🚪 모둠 방 열기</button>
        <button id="t-start-all" class="btn primary">▶ 모든 모둠 시작</button>
        <button id="t-lobby-all" class="btn">↺ 모두 대기실로</button>
        <button id="t-close" class="btn ghost">수업 끝내기 (방 닫기)</button>
        <p id="t-status" class="muted"></p>
      </div>

      <div id="t-rooms" class="t-rooms"></div>
    </section>

    <!-- 결과 발표 (전자칠판/TV) -->
    <section id="t-present" class="screen present" hidden>
      <div class="card">
        <div class="row between">
          <strong id="t-present-title"></strong>
          <button id="t-present-close" class="btn small">✕ 닫기</button>
        </div>
        <div id="result-tabs" class="tabs"></div>
        <h2 id="result-title"></h2>
        <p id="result-hint" class="muted"></p>
      </div>
      <div id="result-pages" class="pages"></div>
      <div class="result-controls sticky-controls">
        <button id="result-prev" class="btn">◀ 이전</button>
        <button id="result-next" class="btn primary">다음 장 ▶</button>
      </div>
      <div class="result-controls">
        <button id="result-follow" class="btn ghost" hidden></button>
        <button id="result-lobby" class="btn ghost">↺ 이 모둠 대기실로</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/teacher.js"></script>
</body>
</html>
